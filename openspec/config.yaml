schema: spec-driven

context: |
  Brand & Architecture Constraints:
  - Brand: WvZz (Company: "WvZz", Manufacturer Code: WvZz, Root C++ namespace: wvzz, UI namespace: wvzz::ui).
  - Target formats: Strictly macOS Universal Binary (arm64;x86_64) VST3 and Standalone formats. AU is not supported.
  - SOLID Principles:
    - Single Responsibility (SRP): Decouple headless real-time DSP (IDSPModule), parameter smoothing, and GUI presentation (IModuleView).
    - Open/Closed (OCP): New modules and multi-instance module slots must plug in without altering host audio engine core.
    - Liskov Substitution (LSP): All modules implement IPluginModule and can be managed polymorphically.
    - Interface Segregation (ISP): Separate audio processing, metering, and view generation.
    - Dependency Inversion (DIP): Modules interact with host routing and modulation exclusively via pre-allocated ProcessContext.
  - Real-time Audio Guarantees: Zero heap allocations, zero locks, and noexcept in all process callbacks.
  - Parameter IDs: All modules support configurable instancePrefix (defaulting to canonical prefixes like "dist", "bp", etc.).
