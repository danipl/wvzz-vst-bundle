<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 60" width="150" height="60">
  <defs>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Background Card (height 44, centered vertically: y = (60 - 44)/2 = 8) -->
  <rect x="8" y="8" width="44" height="44" rx="8" fill="#12161a" stroke="#2a323c" stroke-width="1.5"/>
  
  <!-- Waveform & Lightning Monogram Emblem (centered vertically inside card) -->
  <path d="M 14 20 L 21 42 L 27 26 L 32 42 L 37 18 L 46 18 L 35 42 L 46 42" 
        fill="none" 
        stroke="url(#emblemGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Brand Typography (vertically centered to match the emblem card center at y=30) -->
  <text x="64" y="30" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f0f4f8" letter-spacing="1">WvZz</text>
</svg>
