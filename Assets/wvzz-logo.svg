<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Background Card -->
  <rect x="8" y="8" width="44" height="44" rx="8" fill="#12161a" stroke="#2a323c" stroke-width="1.5"/>
  
  <!-- Waveform & Lightning Monogram Emblem -->
  <path d="M 14 20 L 21 42 L 27 26 L 32 42 L 37 18 L 46 18 L 35 42 L 46 42" 
        fill="none" 
        stroke="url(#emblemGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Brand Typography -->
  <text x="64" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f0f4f8" letter-spacing="1">WvZz</text>
  
  <!-- Subtitle Badge -->
  <g transform="translate(150, 20)">
    <rect x="0" y="0" width="80" height="20" rx="4" fill="rgba(255, 145, 0, 0.15)" stroke="#ff9100" stroke-width="1.2"/>
    <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#ff9100" text-anchor="middle" letter-spacing="1.5">DISTORTION</text>
  </g>
</svg>
