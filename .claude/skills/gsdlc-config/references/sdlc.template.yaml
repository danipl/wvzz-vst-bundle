# .agents/sdlc.yaml — project settings for the gsdlc-* skills.
#
# This file is the only place where a project describes itself to the generic SDLC skills.
# Skills read it at Step 0 and refer to values as {{path.to.key}} (for example {{repo.default_branch}}).
# Every key is optional unless marked REQUIRED. When a key is missing, the skill uses the default
# shown here, or asks the user once and offers to save the answer in this file.
#
# Schema version. Bump only when the gsdlc skills change the format.
version: 1

project:
  name: "My Project"                      # REQUIRED. Human name used in reports.
  # One paragraph: what the product is and who uses it. Skills use it to explain tickets in plain words.
  summary: ""
  # Roles / actors that use the product (used by grill, kickoff "User Roles Affected", manual-test).
  roles: []                               # e.g. [owner, staff, client]
  # Language of tickets, specs, ADRs, commits, PRs. Conversation always follows the user's language.
  artifact_language: "English"

repo:
  host: github                            # github | gitlab | other  (PR steps use `gh` only for github)
  slug: "owner/name"                      # REQUIRED for github. Used by `gh --repo`.
  remote: origin
  default_branch: main
  # Branch name. Placeholders: {type} {ID} {id} {slug}. {ID} = ticket id as written (TS-123), {id} = lowercase.
  branch_pattern: "{type}/{ID}-{slug}"
  branch_types: [feature, bugfix, break]  # break = breaking change (major bump in gsdlc-release)
  # Commit subject. Placeholders: {ID} {summary}.
  commit_pattern: "[{ID}] {summary}"
  pr_title_pattern: "[{ID}] {title}"
  pr_template: ".github/PULL_REQUEST_TEMPLATE.md"   # filled in when present
  merge_method: squash                    # squash | merge | rebase
  delete_branch_on_merge: true

tracker:
  type: youtrack                          # REQUIRED. youtrack | github | none
  # Ticket id prefix. Ticket ids look like <key_prefix>-<number> (TS-123, GH-45).
  # For github, GH-45 means issue #45 of tracker.github.repo.
  key_prefix: "TS"                        # REQUIRED unless type: none
  # Link to one issue. {ID} = full id, {n} = number only.
  issue_url: "https://example.youtrack.cloud/issue/{ID}"

  youtrack:
    base_url: "https://example.youtrack.cloud"
    project: "TS"                         # YouTrack project short name
    mcp_server: "youtrack"                # name of the MCP server / mcporter entry
    token_env: "YOUTRACK_TOKEN"           # REST fallback token variable
    # ADRs stored as YouTrack knowledge-base articles (TS-A-12). Leave empty if ADRs live elsewhere.
    article_prefix: "TS-A"
    article_url: "https://example.youtrack.cloud/articles/{ID}"
    fields:                               # custom field names -> allowed values / defaults
      stage:    { name: "Stage",     default: "Backlog",
                  values: [Backlog, In Development, Review, Test, Staging, Done] }
      priority: { name: "Priority",  default: "Normal",
                  values: [Show-stopper, Critical, Major, Normal, Minor] }
      extra:                              # any other field to always set explicitly
        - { name: "AI Assist", default: "Off", values: [On, Off] }
    stages:                               # SDLC moment -> stage value
      backlog: "Backlog"
      in_progress: "In Development"
      review: "Review"
      done: "Done"
    subtask_link: "subtask of"            # link type: target = subtask, issueToLink = epic
    duplicate_link: "duplicates"
    keep_unassigned: true                 # never set an assignee on create

  github:
    repo: "owner/name"                    # defaults to repo.slug
    epic_label: "epic"
    type_labels: { bug: "bug", feature: "enhancement", task: "task" }
    priority_labels: {}                   # e.g. { Critical: "priority:critical", Normal: "" }
    # How the SDLC stage is shown. labels: one label per stage. project: a Projects v2 Status field.
    stage_mode: labels                    # labels | project | none
    stage_labels: { backlog: "", in_progress: "status:in-progress", review: "status:review", done: "" }
    project: { owner: "", number: 0, status_field: "Status",
               values: { backlog: "Backlog", in_progress: "In Progress", review: "In Review", done: "Done" } }
    use_sub_issues: true                  # GitHub sub-issues for epic -> subtask; else a task list in the epic

# Architecture Decision Records.
adr:
  location: tracker                       # tracker (YouTrack articles) | repo | none
  path: "docs/adr"                        # when location: repo
  id_pattern: "ADR-{n}"

openspec:
  enabled: true
  root: "openspec"
  store: ""                               # value for `--store` when the project uses one
  # Change folder name. Placeholders: {id} (lowercase ticket id) {slug}.
  change_name: "{id}-{slug}"
  # Project-specific spec ids to always read for an area (kickoff Phase 3).
  key_specs: {}                           # e.g. { backend: backend-architecture, rbac: permission-engine }

# Layers of the codebase. Used for subtask naming (<EpicCode>.<n> <LAYER>: ...), sizing, and task order.
# If openspec/config.yaml has a task-order rule, it wins over `order` here.
layers:
  - { code: DB,     desc: "schema, migrations, queries" }
  - { code: BE,     desc: "backend services, repositories, handlers" }
  - { code: FE,     desc: "frontend screens, hooks, API client" }
  - { code: INFRA,  desc: "Docker, CI/CD, deployment" }
  - { code: TEST,   desc: "end-to-end / integration suites" }
  - { code: DOCS,   desc: "documentation and specs" }

# Commands. Each may be a string or a list. Leave empty when the project has none.
commands:
  format: ""                              # e.g. "make fmt"
  format_check: []                        # read-only formatting check(s) used by review, {files} = changed files
  lint: []                                # e.g. ["make -C backend lint", "make -C frontend lint"]
  test: []                                # e.g. ["make -C backend test", "cd frontend && CI=true npx jest --ci"]
  typecheck: []

# Sub-agents the kickoff / feedback skills may delegate to (when the harness supports sub-agents).
delegates: []
  # - { agent: backend-fixer,     layers: [DB, BE] }
  # - { agent: frontend-designer, layers: [FE] }

# Project rules the skills enforce (grill questions, review invariants, audit data-model checks).
# Write each as one testable sentence.
rules:
  invariants: []          # e.g. "All env vars are read only in internal/config (no os.Getenv elsewhere)."
  data_model: []          # e.g. "Money is stored in integer minor units."
  ui: []                  # e.g. "No modal popups; use inline sections or dedicated routes."
  grill_branches: []      # extra decision-tree branches for gsdlc-grill, e.g. "Tenant isolation: ..."
  related_skills: []      # project skills to load before editing an area, e.g. "backend/** -> echo-backend"

review:
  # Extra static checks on the diff. Each: name, strings to search in added code (git -S),
  # path regex the check applies to, path regex to ignore, severity (BLOCKER | SUGGESTION).
  static_checks: []
    # - { name: "Config hygiene", search: ["os.Getenv"], paths: '\.go$', exclude: 'internal/config/|_test\.go$', severity: BLOCKER }
  i18n:
    enabled: false
    locales: [en]
    locale_file: "src/i18n/locales/{locale}/translation.json"   # nested JSON
    source_dir: "src"
    key_patterns:                         # Python regexes, group 1 = key
      - "\\bt\\(\\s*['\"]([A-Za-z0-9_.]+)['\"]"
  ci_quota_fallback: true                 # run local suites when CI fails only for quota/billing reasons

manual_test:
  dev_doc: ""                             # doc that explains local setup, seed users, login
  env_file: ".env"
  env_example: ".env.example"
  start: ""                               # starts the local stack in the background, e.g. "docker compose up -d --build"
  stop: ""                                # e.g. "docker compose down"
  seed: ""                                # e.g. "make refresh-seed"
  health:                                 # URLs that must answer before checks start
    - { url: "http://localhost:8080/health", expect: "ok" }
  urls: {}                                # name -> URL shown on the environment card
  seed_users: ""                          # where seed users are listed (doc path or endpoint)
  doctor_extra: []                        # extra read-only diagnostics, each { name, cmd, fix }
  forbidden_commands: []                  # never run, e.g. ["docker compose down -v", "make watch-clean"]

release:
  enabled: true
  tag_pattern: "semver"                   # semver (1.2.3) | vsemver (v1.2.3)
  # How the tag is created:
  #   workflow: dispatch a GitHub Actions workflow (release.workflow) with input bump=<major|minor|patch>
  #   local:    `git tag` + `git push` (after approval)
  #   gh:       `gh release create` creates the tag
  mode: local
  workflow: ""                            # e.g. "tag.yml"
  workflow_input: "bump"
  changelog_sections:
    - { title: "Features",        match: "feature/|feat" }
    - { title: "Bug Fixes",       match: "bugfix/|fix" }
    - { title: "Infrastructure",  match: "ci|infra|docker|deploy" }
    - { title: "Maintenance",     match: ".*" }
  post_release_checks: []                 # e.g. ["gh run list --event push --limit 5"]
  artifacts: []                           # e.g. ["ghcr.io/owner/app-backend:{tag}"]

communication:
  # Path to the project's communication standard. Empty = the gsdlc default
  # (~/.agents/skills/gsdlc-config/references/communication.md).
  standard: ""
  # Remote channels with a short output format (e.g. a Telegram bridge). Empty = local console only.
  channels: []
