# Example: a Go + React Native monorepo tracked in YouTrack (based on the TattooStudio setup).
version: 1

project:
  name: "TattooStudio"
  summary: "Studio management platform for tattoo studios: appointments, artists, clients, payments."
  roles: [owner, admin, reception, artist, client]
  artifact_language: "English"

repo:
  host: github
  slug: "AthenixLab/tattoostudio"
  default_branch: main
  branch_pattern: "{type}/{ID}-{slug}"
  branch_types: [feature, bugfix, break]
  commit_pattern: "[{ID}] {summary}"
  pr_title_pattern: "[{ID}] {title}"
  pr_template: ".github/PULL_REQUEST_TEMPLATE.md"
  merge_method: squash

tracker:
  type: youtrack
  key_prefix: "TS"
  issue_url: "https://athenixlab.youtrack.cloud/issue/{ID}"
  youtrack:
    base_url: "https://athenixlab.youtrack.cloud"
    project: "TS"
    mcp_server: "youtrack-athenixlab"
    token_env: "YOUTRACK_TOKEN"
    article_prefix: "TS-A"
    article_url: "https://athenixlab.youtrack.cloud/articles/{ID}"
    fields:
      stage:    { name: "Stage",    default: "Backlog", values: [Backlog, In Development, Review, Test, Staging, Done] }
      priority: { name: "Priority", default: "Normal",  values: [Show-stopper, Critical, Major, Normal, Minor] }
      extra:
        - { name: "AI Assist", default: "Off", values: [On, Off] }
    stages: { backlog: "Backlog", in_progress: "In Development", review: "Review", done: "Done" }
    subtask_link: "subtask of"
    duplicate_link: "duplicates"
    keep_unassigned: true

adr:
  location: tracker

openspec:
  enabled: true
  root: "openspec"
  change_name: "{id}-{slug}"
  key_specs:
    backend: backend-architecture
    rbac: permission-engine
    frontend: frontend-styling
    navigation: navigation-ia
    infra: deployment-infra

layers:
  - { code: DB,     desc: "Ent schema, migrations, queries" }
  - { code: BE,     desc: "Go services, repositories, handlers, eventbus" }
  - { code: FE,     desc: "React Native / web screens, hooks, API client" }
  - { code: INFRA,  desc: "Docker, CI/CD, deployment" }
  - { code: TEST,   desc: "end-to-end, load, multi-node suites" }
  - { code: MOBILE, desc: "native builds" }
  - { code: DOCS,   desc: "documentation and specs" }

commands:
  format: "make fmt"
  format_check: ["cd frontend && ./node_modules/.bin/prettier --check {files}"]
  lint: ["make -C backend lint", "make -C frontend lint"]
  test: ["make -C backend test", "make -C frontend test"]

delegates:
  - { agent: backend-fixer,     layers: [DB, BE] }
  - { agent: frontend-designer, layers: [FE] }

rules:
  invariants:
    - "PII encryption (EncryptionService) lives only inside repository implementations."
    - "Environment variables are read only in internal/config (no os.Getenv elsewhere)."
    - "Devtool code under backend/cmd/devtool/** and backend/devtool/** is never imported by internal/."
    - "Every read and write is scoped by studio_id."
  data_model:
    - "Money is stored in integer minor units (cents)."
    - "New required columns have a backfill rule."
    - "Client screens never call staff-only endpoints."
  ui:
    - "C8: no popups or modal overlays (inline sections, dedicated routes, or AppPanel)."
    - "C9: full-width layout."
    - "Every user-facing string exists in EN and ES via t('key', 'Default')."
  grill_branches:
    - "Tenant isolation: is every query scoped by studio_id?"
    - "PII boundary: which fields are PII; does anything export, log, or cache PII?"
  related_skills:
    - "backend/** -> echo-backend, golang-testing"
    - "frontend/** -> react-frontend"

review:
  static_checks:
    - { name: "Config hygiene", search: ["os.Getenv", "os.LookupEnv"], paths: '\.go$', exclude: 'internal/config/|_test\.go$|devtool/', severity: BLOCKER }
    - { name: "C8 no popups", search: ["<Modal", "<AppModal", "<ConfirmModal"], paths: '^frontend/src/.*\.tsx$', exclude: '', severity: BLOCKER }
  i18n:
    enabled: true
    locales: [en, es]
    locale_file: "frontend/src/i18n/locales/{locale}/translation.json"
    source_dir: "frontend/src"
    key_patterns:
      - "\\bt\\(\\s*['\"]([A-Za-z0-9_.]+)['\"]"
      - "(?:i18nKey|labelKey)\\s*:\\s*['\"]([A-Za-z0-9_.]+)['\"]"
  ci_quota_fallback: true

manual_test:
  dev_doc: "__doc__/DEVELOPMENT.md"
  start: "docker compose up -d --build"
  stop: "docker compose down"
  seed: "make refresh-seed"
  health:
    - { url: "http://localhost:8080/health", expect: '"status":"ok"' }
    - { url: "http://localhost:8082", expect: "HTTP 200" }
  urls:
    web: "http://localhost:8082"
    api: "http://localhost:8080/api/v1"
  seed_users: "__doc__/DEVELOPMENT.md#pre-seeded-development-users"
  forbidden_commands: ["make watch-clean", "docker compose down -v", "make watch"]

release:
  tag_pattern: semver
  mode: workflow
  workflow: "tag.yml"
  workflow_input: "bump"
  artifacts:
    - "ghcr.io/athenixlab/tattoostudio-backend:{tag}"
    - "ghcr.io/athenixlab/tattoostudio-frontend:{tag}"

communication:
  standard: "AGENTS.md#communication-standard"
  channels: [telegram]
