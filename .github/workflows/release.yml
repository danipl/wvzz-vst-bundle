name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      ref:
        description: Tag to publish (e.g. v0.1.0)
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish Release Bundles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install Ninja
        run: brew install ninja
      - name: Stamp version into CMakeLists.txt
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || github.ref_name }}"
          TAG_VERSION="${REF#v}"
          echo "Stamping release version $TAG_VERSION into CMakeLists.txt..."
          sed -i '' -E "s/project\(WvZzBundle VERSION [0-9]+\.[0-9]+\.[0-9]+/project(WvZzBundle VERSION $TAG_VERSION/" CMakeLists.txt
          grep "project(WvZzBundle VERSION" CMakeLists.txt
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"
      - name: Build all targets
        run: cmake --build build --config Release
      - name: Run headless DSP tests
        run: ctest --test-dir build --output-on-failure
      - name: Package format-split Universal Binary bundles
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || github.ref_name }}"
          TAG_VERSION="${REF#v}"
          make package VERSION="$TAG_VERSION"
      - name: Upload release assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || github.ref_name }}"
          echo "Uploading assets to release $REF..."
          gh release upload "$REF" dist/*.zip --clobber
